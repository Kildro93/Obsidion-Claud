<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <!-- Preheader: erscheint in der Inbox-Vorschau, ist im Body unsichtbar -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;
                      box-shadow:0 2px 12px rgba(28,125,112,.12);">

          <!-- Header -->
          <tr>
            <td style="background:#1c7d70;padding:28px 32px;">
              <div style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;
                          color:rgba(255,255,255,.72);font-weight:600;">Nestbau</div>
              <div style="font-size:24px;line-height:1.25;color:#ffffff;font-weight:700;margin-top:6px;">
                {{headline}}
              </div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;color:#2b2b28;font-size:15px;line-height:1.6;">
              {{body}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 32px 28px;border-top:1px solid #ece7dc;
                       color:#7a746a;font-size:12px;line-height:1.6;">
              Nestbau – Haushalt. Aufgaben. Rezepte.<br>
              {{footerNote}}
            </td>
          </tr>
        </table>

        <div style="max-width:520px;margin:14px auto 0;color:#9b958a;font-size:11px;line-height:1.6;text-align:center;">
          Diese Nachricht wurde an {{recipient}} gesendet.
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
