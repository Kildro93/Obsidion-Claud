name: OneNote to GitHub Sync

on:
  schedule:
    - cron: '0 6,10,16 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install OneNote2Markdown
        run: npm install -g onenote2markdown
      
      - name: Export OneNote to Markdown
        env:
          ONENOTE_NOTEBOOK_ID: 'Primarlehrer-Studium'
          OUTPUT_PATH: './PROJEKTE/Primarlehrer-Studium/Studienmaterial'
        run: |
          mkdir -p $OUTPUT_PATH
          onenote2markdown \
            --notebook "$ONENOTE_NOTEBOOK_ID" \
            --output "$OUTPUT_PATH" \
            --format markdown
      
      - name: Configure Git
        run: |
          git config --local user.email "onenote-sync-bot@github.com"
          git config --local user.name "OneNote Auto-Sync Bot"
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet PROJEKTE/Primarlehrer-Studium/Studienmaterial/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit & Push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add PROJEKTE/Primarlehrer-Studium/Studienmaterial/
          git commit -m "Auto-Sync OneNote: $(date +'%d.%m.%Y %H:%M') [$(date +'%A')]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.ONENOTE_TOKEN }}
      
      - name: Skip if no changes
        if: steps.changes.outputs.has_changes == 'false'
        run: echo "✅ No OneNote changes, skipping commit"
